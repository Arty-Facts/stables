# ── stab tmux ───────────────────────────────────────────────
# Panes & windows:
#   F1              toggle help window (and back)
#   F2              split horizontally (side-by-side)
#   F3              split vertically   (top/bottom)
#   F4              exit (detach, leave everything running)
#   F5              kill current pane   (confirm)
#   F6              kill current window (confirm)
#   C-n / C-p       next / previous window
#   C-b c           new window
#   M-1..M-4        jump to main / shell / logs / help
# Moving between panes:
#   C-b <arrow>     switch pane
#   C-b o           cycle panes
#   C-b z           zoom pane (toggle)
# Resize splits:
#   C-b C-<arrow>   resize pane (hold Ctrl with arrow)
#   C-b M-<arrow>   resize pane by 5 (hold Alt with arrow)
# Session / exit:
#   C-b d           detach (leave everything running)
#   C-b ?           full key menu
#   C-b s           choose session
#   C-b [           scroll / copy mode (q to quit)
# ──────────────────────────────────────────────────────────────

set -g default-terminal "screen-256color"

# Truecolor (24-bit RGB): forward it to the terminal and advertise it to apps
# inside tmux. Without this, the Pi harness falls back to 256-color
# approximation because TERM=screen-256color lacks the RGB flag and
# COLORTERM is unset.
set -as terminal-features ",xterm*:RGB"
set-environment -g COLORTERM "truecolor"

set -g history-limit 10000
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# One-line hint in the status bar.
set -g status-left " stab "
set -g status-right "F1 help | F2↔ F3↕ split | F4 exit | F5/F6 kill pane / window | C-b ? keys "

# Hotkeys for creating panes and windows.
bind -n F1 if-shell -F "#{==:#{window_name},help}" "last-window" "select-window -t help"
bind -n F2 split-window -h -c "#{pane_current_path}"
bind -n F3 split-window -v -c "#{pane_current_path}"
bind -n F4 detach-client
bind -n F5 confirm-before -p "kill-pane? (y/n)" kill-pane
bind -n F6 confirm-before -p "kill-window? (y/n)" kill-window
bind    F1 if-shell -F "#{==:#{window_name},help}" "last-window" "select-window -t help"
bind    F2 split-window -h -c "#{pane_current_path}"
bind    F3 split-window -v -c "#{pane_current_path}"
bind    F4 detach-client
bind    F5 confirm-before -p "kill-pane? (y/n)" kill-pane
bind    F6 confirm-before -p "kill-window? (y/n)" kill-window

# Window navigation.
bind -n C-n next-window
bind -n C-p previous-window
bind -n M-1 select-window -t main
bind -n M-2 select-window -t shell
bind -n M-3 select-window -t logs
bind -n M-4 select-window -t help
